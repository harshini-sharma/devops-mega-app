services:
  mongo:
    image: mongo:7
    container_name: mongo-service
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
  

  redis:
    image: redis:7
    container_name: redis-service
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: wanderlust-backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "5000:5000"
  
  frontend:
    build: ./frontend
    container_name: wanderlust-frontend
    env_file:
      - ./frontend/.env.docker
    ports:
      - "5173:5173"

volumes:
  mongo-data: